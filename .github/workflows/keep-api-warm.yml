name: Keep the demo API awake

# Render's free plan stops the API after 15 minutes without a request, and the
# next visitor then waits up to a minute for it to start again. A request every
# 10 minutes keeps it running. That uses about 744 of the free plan's 750
# instance hours a month, so it only fits while this is the workspace's one
# free service; disable the workflow to stop it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.EXPO_PUBLIC_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # A failed run is the uptime alert: GitHub notifies whoever last edited this
      # file. Each run also records how long the API took to answer, so cold
      # starts and hosted latency are visible over time in the run summaries.
      - name: Request the health check and record how long it took
        env:
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          timing=$(curl --fail --silent --show-error --max-time 90 --retry 2 \
            --output /dev/null --write-out '%{http_code} %{time_total}' "${API_URL%/}/health")
          read -r status seconds <<< "$timing"
          echo "Health check answered $status in ${seconds}s"
          {
            echo "| Checked at (UTC) | Status | Seconds |"
            echo "|---|---|---|"
            echo "| $(date -u +%FT%TZ) | $status | $seconds |"
          } >> "$GITHUB_STEP_SUMMARY"
