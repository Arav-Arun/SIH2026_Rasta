name: Android APK

# Builds the field officer and driver app and publishes it as `rasta.apk` on the
# latest release, which is where the landing page's download button points.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No Gradle cache here: the Android project only exists after prebuild.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Write the app's server addresses
        working-directory: apps/mobile
        # Set these under Settings > Secrets and variables > Actions > Variables.
        # They are compiled into the app; the publishable key is public by design.
        # An empty value would replace the app's own fallback, so only set ones are written.
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          : > .env
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then echo "$name=$value" >> .env; fi
          done
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::EXPO_PUBLIC_API_URL is not set, so this APK cannot reach a server and will not be published."
          fi

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: apps/mobile/android
        # Prebuild leaves gradle.properties without a final newline, so start with one;
        # otherwise the setting is glued onto the last line and breaks it.
        run: |
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Keep the Gradle problems report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: apps/mobile/android/build/reports/problems/

      - name: Collect the APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk rasta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rasta-apk
          path: rasta.apk

      - name: Publish as the latest release
        if: vars.EXPO_PUBLIC_API_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" rasta.apk \
            --title "RASTA Android app (build ${{ github.run_number }})" \
            --notes "Android APK for field officers and drivers, built from ${GITHUB_SHA::7}." \
            --latest
