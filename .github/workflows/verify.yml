name: Verify

# Lint, format, type-check and unit-test on every push to main and every pull
# request, so a broken change shows up before the API redeploys from main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: python -m pip install -e './api[dev]'

      - name: Lint
        run: ruff check api

      - name: Format
        run: ruff format --check api

      - name: Unit tests
        working-directory: api
        run: python -m pytest

  api-db:
    name: API against a database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Install
        run: python -m pip install -e './api[dev]'

      - name: Start the database
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Point the API at it
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "APP_MODE=local_demo"
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "SOURCE_FIXTURE_ROOT=$RUNNER_TEMP/rasta-sources"
            echo "TELEMETRY_TOKEN_SECRET=$(openssl rand -hex 32)"
          } > api/.env
          PYTHONPATH=api python -m app.recorded_samples "$RUNNER_TEMP/rasta-sources"

      # The demo password is random and printed, so the output is not kept. The
      # story runs twice because a re-run starts a second trip, and the probe-speed
      # test needs two.
      - name: Load the pilot network, demo accounts and story
        shell: bash
        run: |
          PYTHONPATH=api python -m app.demo_setup --story > /dev/null
          PYTHONPATH=api python -m app.demo_setup --skip-network --story > /dev/null

      - name: Tests, database included
        working-directory: api
        shell: bash
        run: |
          python -m pytest -rs | tee "$RUNNER_TEMP/pytest.txt"
          if grep -q " skipped" "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::Database tests were skipped; here they must run."
            exit 1
          fi

  ml:
    name: Model pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        run: python -m pip install -e './ml[dev]'

      - name: Lint
        run: ruff check ml

      - name: Format
        run: ruff format --check ml

      - name: Tests (synthetic data)
        working-directory: ml
        run: python -m pytest

  web:
    name: Web and Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Contract types match the API schema
        run: npm run contracts:check
