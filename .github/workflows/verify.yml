name: Verify

# Lint, format, type-check and unit-test on every push to main and every pull
# request, so a broken change shows up before the API redeploys from main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: python -m pip install -e './api[dev]'

      - name: Lint
        run: ruff check api

      - name: Format
        run: ruff format --check api

      - name: Unit tests
        working-directory: api
        run: python -m pytest

  ml:
    name: Model pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        run: python -m pip install -e './ml[dev]'

      - name: Lint
        run: ruff check ml

      - name: Format
        run: ruff format --check ml

      - name: Tests (synthetic data)
        working-directory: ml
        run: python -m pytest

  web:
    name: Web and Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test
