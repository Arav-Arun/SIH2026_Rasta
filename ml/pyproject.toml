[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rasta-ml"
version = "0.1.0"
description = "Dataset, training and evaluation pipeline for a RASTA landslide risk model"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "h5py>=3.12,<4.0",
    "numpy>=2.1,<3.0",
    "scikit-learn>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0,<10.0.0",
    "ruff>=0.15.0,<0.16.0",
]

[project.scripts]
rasta-ml = "rasta_ml.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["rasta_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
