[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rasta-api"
version = "0.1.0"
description = "API for the RASTA SIH26002 pilot"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.135.0,<0.136.0",
    "httpx>=0.28.0,<0.29.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.13.0,<3.0.0",
    "uvicorn[standard]>=0.42.0,<0.43.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<0.29.0",
    "pytest>=9.1.0,<10.0.0",
    "ruff>=0.15.0,<0.16.0",
    # scripts/ml/evaluate_risk_models.py: the audit that rejected the
    # supervised model re-trains it to show what its accuracy measures. The
    # API itself serves no trained model and needs none of these.
    "joblib>=1.4.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
